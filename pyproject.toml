[project]
name = "torchcg"
version = "0.1.0"
description = "Mint, package, store, and reuse PyTorch AOTInductor graphs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Fidika", email = "paul@fidika.com" }]
# tensorfs sets the floor at 3.11: its compiled extension is abi3 over the
# stable-ABI buffer protocol, which entered CPython in 3.11.
requires-python = ">=3.11"
dependencies = [
    "tensorfs",
    "safetensors>=0.8,<0.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/cozy-creator/torchcg"
Issues = "https://github.com/cozy-creator/torchcg/issues"

# tensorfs is consumed by git pin, not from PyPI: it is an internal peer with no
# published release, and its consumers are all in this workspace. The cost is a
# Rust toolchain wherever the lock is resolved, because tensorfs builds with
# maturin -- see .github/workflows/ci.yaml.
[tool.uv.sources]
tensorfs = { git = "https://github.com/cozy-creator/tensorfs" }

[project.optional-dependencies]
torch = ["numpy>=1.26,<2.3", "torch>=2.8"]
dev = [
    "mypy>=1.10",
    "pytest>=9.0",
    "ruff>=0.6",
]

[project.scripts]
torchcg = "torchcg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchcg"]

[tool.hatch.build.targets.sdist]
include = [
    "src/torchcg",
    "docs",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_aoti: exercise the installed PyTorch AOTInductor implementation"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
