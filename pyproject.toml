[project]
name = "torchcg"
version = "0.1.0"
description = "Mint, package, store, and reuse PyTorch AOTInductor graphs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Fidika", email = "paul@fidika.com" }]
requires-python = ">=3.10"
dependencies = [
    "hashrepo>=0.3,<0.4",
    "safetensors>=0.8,<0.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/cozy-creator/torch-compiled-graphs"
Issues = "https://github.com/cozy-creator/torch-compiled-graphs/issues"

[project.optional-dependencies]
torch = ["numpy>=1.26,<2.3", "torch>=2.8"]
dev = [
    "mypy>=1.10",
    "pytest>=9.0",
    "ruff>=0.6",
]

[project.scripts]
torchcg = "torchcg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchcg"]

[tool.hatch.build.targets.sdist]
include = [
    "src/torchcg",
    "docs",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_aoti: exercise the installed PyTorch AOTInductor implementation"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The hashrepo PyPI project was deleted permanently (DESIGN-RULINGS "Release
# policy", 2026-08-16): internal consumption is git-pinned, and nothing
# publishes to PyPI as a side effect of development. This rev is the contents
# of the last published 0.3.1, so the resolution is unchanged — only its source
# is. tcg#28 replaces it with a pin at CURRENT tensorfs when it repins the
# imports; update the rev there rather than deleting this entry.
[tool.uv.sources]
hashrepo = { git = "https://github.com/cozy-creator/tensorfs", rev = "0d0437570aac241ed234b741e66af8c79492d872" }
