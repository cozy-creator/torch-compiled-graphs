[project]
name = "compiled-graphs"
version = "0.1.0"
description = "Mint, package, store, and reuse PyTorch AOTInductor graphs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paul Fidika", email = "paul@fidika.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/cozy-creator/compiled-graphs"
Issues = "https://github.com/cozy-creator/compiled-graphs/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=9.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiled_graphs"]

[tool.hatch.build.targets.sdist]
include = [
    "src/compiled_graphs",
    "docs",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
