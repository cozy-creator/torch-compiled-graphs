name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # tensorfs is a git-pinned maturin package, so resolving this lock compiles
      # a Rust extension from source. ubuntu-latest already ships rustup; this
      # step pins the toolchain to stable so a runner image change cannot
      # silently break the build. The compile itself is cached by setup-uv above
      # -- uv keys the built wheel on the git rev, so only a tensorfs bump pays
      # for it again. Measured cost of a cold build: ~40s (tcg#28).
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests
      - run: uv run mypy
      # pgw#1547 (Paul, 2026-08-20): a compiled graph is not a "cell". This
      # package is UPSTREAM of the vocabulary — python-gen-worker vendors
      # contracts/ and identity.py byte-for-byte — so a `cell` landing here is
      # copied into a consumer, not merely written. The selftest proves the
      # fence goes red AND proves it does not flag `cancelled`/`CancelledError`,
      # which contain the same letters.
      - run: uv run python scripts/lint_retired_cell_spellings.py --selftest
      - run: uv run python scripts/lint_retired_cell_spellings.py
      - run: uv run pytest
